<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>System map — multi-service</title>
<style>
  :root{--paper:#f5f5f5;--paper-2:#ececec;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;
        --rule:rgba(45,49,66,0.12);--rule-solid:#bfc0c0;--accent:#eb6c36;--accent-tint:rgba(235,108,54,0.08);}
  html,body{margin:0;background:var(--paper);}
  body{padding:40px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);}
  figure{margin:0;max-width:1000px;}
  figcaption{margin-top:18px;font-size:13px;line-height:1.55;color:var(--muted);max-width:80ch;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
</style>
</head>
<body>
<figure>
<svg id="system" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Three related services: who calls whom, from the trace ids</title>
  <desc id="d">Each box is a Spring service discovered in the tree, with its endpoint count, tables and test files. Arrows are call edges counted from shared trace ids in the call log. Services that exchange calls are connected; the number on each arrow is how often it happened in the sample.</desc>
  <rect x="0" y="0" width="900" height="470" fill="var(--paper)"/>
  <text x="24" y="40" font-size="12" letter-spacing="0.09em" fill="var(--soft)" class="mono">SERVICES AND CALL EDGES — FROM TRACES, NOT FROM A DRAWING</text>
  <line x1="24" y1="52" x2="876" y2="52" stroke="var(--rule)" stroke-width="1"/>
  <g>
    <rect x="24" y="96" width="232" height="156" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)" stroke-width="1"/>
    <text x="40" y="122" font-size="14.5" font-weight="600">api-gateway</text>
    <text x="40" y="142" font-size="11" fill="var(--muted)">module api-gateway</text>
    <text x="40" y="164" font-size="11.5" fill="var(--muted)">2 endpoints, 1 controller</text>
    <text x="40" y="181" font-size="11.5" fill="var(--muted)">0 entities · tables: none</text>
    <text x="40" y="198" font-size="11.5" fill="var(--muted)">0 test files</text>
  </g>
  <g>
    <rect x="340" y="96" width="232" height="156" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)" stroke-width="1"/>
    <text x="356" y="122" font-size="14.5" font-weight="600">customer-svc</text>
    <text x="356" y="142" font-size="11" fill="var(--muted)">module customer-svc</text>
    <text x="356" y="164" font-size="11.5" fill="var(--muted)">2 endpoints, 1 controller</text>
    <text x="356" y="181" font-size="11.5" fill="var(--muted)">1 entity · tables: customers</text>
    <text x="356" y="198" font-size="11.5" fill="var(--muted)">0 test files</text>
  </g>
  <g>
    <rect x="656" y="96" width="232" height="156" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)" stroke-width="1"/>
    <text x="672" y="122" font-size="14.5" font-weight="600">order-svc</text>
    <text x="672" y="142" font-size="11" fill="var(--muted)">module order-svc</text>
    <text x="672" y="164" font-size="11.5" fill="var(--muted)">2 endpoints, 1 controller</text>
    <text x="672" y="181" font-size="11.5" fill="var(--muted)">1 entity · tables: orders</text>
    <text x="672" y="198" font-size="11.5" fill="var(--muted)">0 test files</text>
  </g>
  <line x1="256" y1="174" x2="340" y2="174" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="340,174 330,169 330,179" fill="var(--muted)"/>
  <text x="298" y="167" font-size="11" fill="var(--soft)" text-anchor="middle" class="mono">2 calls</text>
  <path d="M 140 252 L 140 278 L 772 278 L 772 252" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="772,252 767,262 777,262" fill="var(--muted)"/>
  <text x="456" y="272" font-size="11" fill="var(--soft)" text-anchor="middle" class="mono">2 calls</text>
  <line x1="572" y1="164" x2="656" y2="164" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="656,164 646,159 646,169" fill="var(--muted)"/>
  <text x="614" y="157" font-size="11" fill="var(--soft)" text-anchor="middle" class="mono">1 call</text>
  <line x1="656" y1="186" x2="572" y2="186" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="572,186 562,181 562,191" fill="var(--muted)"/>
  <text x="614" y="179" font-size="11" fill="var(--soft)" text-anchor="middle" class="mono">2 calls</text>
  <line x1="24" y1="366" x2="876" y2="366" stroke="var(--rule)" stroke-width="1"/>
  <text x="24" y="390" font-size="11.5" fill="var(--muted)" class="mono">7 calls across 5 trace ids</text>
  <text x="24" y="410" font-size="11.5" fill="var(--muted)" class="mono">shared trace id is the only thing that joins services</text>
  <text x="24" y="430" font-size="11.5" fill="var(--muted)" class="mono">shared tables: none</text>
</svg>
<figcaption><strong>Figure 1.</strong> Every box was discovered by reading source files, and every arrow was
counted from trace ids shared between services in the call log. A service that appears with no arrow either
has no caller in the sample or is never called — the diagram cannot tell those apart, which is why the count
is printed next to each edge instead of a guess.</figcaption>
</figure>
