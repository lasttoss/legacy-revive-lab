name: ci

on:
  push: {branches: [main, revival]}
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The maps are generated from the logs, so they must not drift: regenerate, then fail on diff.
      - name: Regenerate the maps
        run: |
          python3 kit/inventory.py
          python3 kit/sqlmap.py
          python3 kit/errors.py
          python3 kit/servicemap.py
          python3 kit/gen_docs.py
          git diff --exit-code -- docs/ || (echo "generated docs are stale: run make all and commit"; exit 1)

      # Golden recordings are committed artifacts: the suite is generated from them, never hand-edited.
      - name: Generate the suite from the recordings
        run: python3 kit/gen_tests.py && git diff --exit-code -- legacy-app/src/test/java/com/example/legacy/GoldenMasterTest.java

      - name: Verify (tests + JaCoCo 80% floor + ratchet)
        run: mvn -B -Dmaven.repo.local=$HOME/.m2 verify --file legacy-app/pom.xml

      - name: Coverage gate
        run: python3 kit/coverage_gate.py

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: legacy-app/target/site/jacoco/
