name: ci

on:
  push: {branches: [main, revival]}
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The maps are generated from the logs, so they must not drift: regenerate, then fail on diff.
      - name: Regenerate the maps
        run: |
          python3 kit/inventory.py
          python3 kit/sqlmap.py
          python3 kit/errors.py
          python3 kit/servicemap.py
          python3 kit/gen_docs.py
          git diff --exit-code -- docs/ || (echo "generated docs are stale: run make all and commit"; exit 1)

      # Golden recordings are committed artifacts: the suite is generated from them, never hand-edited.
      - name: Generate the suite from the recordings
        run: python3 kit/gen_tests.py && git diff --exit-code -- legacy-app/src/test/java/com/example/legacy/GoldenMasterTest.java

      - name: Verify (tests + JaCoCo 80% floor + ratchet)
        run: mvn -B -Dmaven.repo.local=$HOME/.m2 verify --file legacy-app/pom.xml

      # The AI step is optional, so CI never calls it — it only proves the prompt builds offline and
      # that the committed advice file is still a suggestion, not a gate.
      - name: AI advisor, offline only
        run: |
          python3 kit/advise.py --check-prompt
          python3 kit/advise.py --dry-run
          python3 kit/advise.py --check

      # On a pull request, print what the diff touches: endpoints, tables, callers and recordings to re-run.
      - name: Change impact (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 kit/changed.py --git | tee -a "$GITHUB_STEP_SUMMARY"

      # The suite writes samples/spans.log. Rebuild the map from the traces and fail when a documented
      # endpoint never executed, or an executed call is undocumented.
      - name: Spans agree with the maps
        run: |
          python3 kit/spanmap.py            # regenerate from this run's traces
          python3 kit/spanmap.py --check    # deterministic: documented endpoints == executed endpoints

      - name: Coverage gate
        run: python3 kit/coverage_gate.py

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: legacy-app/target/site/jacoco/
